services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunelle_app
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    networks:
      - lunelle_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: lunelle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/lunelle.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - lunelle_net

networks:
  lunelle_net:
    driver: bridge
